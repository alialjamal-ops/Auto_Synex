};

let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < 0.5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2);
const back = (x) => { const c = 2.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const DIR = AR ? -1 : 1;

// pop: overshoot scale-in that lands exactly on its beat
const pop = (t, at, d = 0.32) => { const p = prog(t, at, at + d); return { o: clamp(p * 4), s: lerp(0.3, 1, back(p)) }; };

window.seek = (t) => {

  const shake = hit * 7;

  set($("streak"), { opacity: 0.3 + 0.7 * Math.max(hit, pulse * 0.5), transform: `translateY(${lerp(-60, 60, (Math.sin(t * 0.5) + 1) / 2)}px) scaleX(${0.6 + hit * 0.7}) rotate(-4deg)` });

    const inn = eo(prog(t, a, a + 0.22)); const out = id === "h" ? 0 : prog(t, b - 0.14, b);
    const vis = t >= a && t < b;

  }

  // A: logo slams in on beat 2 (t=1.0)
  { const p = eo(prog(t, 0.55, 1.0)); set($("alogo"), { opacity: clamp(p * 3), transform: `scale(${lerp(3.2, 1, p)})`, filter: `blur(${lerp(30, 0, p)}px) drop-shadow(0 0 ${40 + 60 * hit}px rgba(92,200,255,.6))` });
    const w = pop(t, 1.2); set($("aword"), { opacity: w.o, transform: `scale(${w.s})` });

  { all("#c .side").forEach((el) => set(el, AR ? { right: "100px", left: "auto" } : { left: "100px", right: "auto" }));
    const h = eo(prog(t, 5.05, 5.4)); set($("ch"), { opacity: h, transform: `translateX(${lerp(-120 * DIR, 0, h)}px)` });

  { const p = eo(prog(t, 9, 9.55)); const drift = prog(t, 9, 13);
    set($("dphone"), { [AR ? "right" : "left"]: "200px", [AR ? "left" : "right"]: "auto", opacity: clamp(p * 2), transform: `translateY(${lerp(700, -40 * drift, p)}px) rotate(${lerp(-24, -5, p) * DIR}deg) scale(${1 + 0.012 * pulse})` });
    all("#d .side").forEach((el) => set(el, AR ? { right: "770px", left: "auto" } : { left: "770px", right: "auto" }));
    const h = eo(prog(t, 9.1, 9.5)); set($("dh"), { opacity: h, transform: `translateY(${lerp(80, 0, h)}px)` });
    all("#d .ds").forEach((el, i) => { const k = pop(t, 10 + i * 0.5); const on = t >= 10.3 + i * 0.5; set(el, { opacity: k.o, transform: `scale(${k.s})`, background: on ? "rgba(47,107,255,.32)" : "rgba(255,255,255,.07)", borderColor: on ? "rgba(92,200,255,.8)" : "rgba(255,255,255,.14)" }); });
    const k = pop(t, 11.5, 0.4); set($("dok"), { opacity: k.o, transform: `scale(${k.s})`, transformOrigin: AR ? "right center" : "left center" }); }

  // E: four cards, one per half-beat
  { const h = eo(prog(t, 13, 13.3)); set($("eh"), { opacity: h, transform: `scale(${lerp(1.3, 1, h)})` });
    all("#e .card").forEach((el, i) => { const idx = AR ? 3 - i : i; const a = 13 + i * 0.5; const p = eo(prog(t, a, a + 0.3)); const drift = prog(t, 13, 17);
      set(el, { left: `${130 + idx * 420}px`, top: "300px", opacity: clamp(p * 3), transform: `translateY(${lerp(-520, (i % 2 ? 24 : -14) - 20 * drift, p)}px) rotate(${lerp((i - 1.5) * 14, (i - 1.5) * 1.4, p)}deg) scale(${lerp(1.25, 1, p) + 0.012 * pulse})` });
      el.querySelector("img").style.transform = `scale(${lerp(1.25, 1.04, drift)})`; }); }

  // F: Arabic dark ↔ English light wipe (there and back)
  { const p = eo(prog(t, 17, 17.45)); set($("fframe"), { opacity: clamp(p * 2), transform: `translateY(${lerp(300, 0, p)}px) scale(${lerp(0.9, 1, p) + 0.008 * pulse})` });
    const w = eio(prog(t, 17.6, 18.5)) - eio(prog(t, 18.9, 19.7)) * 0.55; const x = lerp(115, -15, w);
    set($("ftop"), { clipPath: `polygon(0 0, ${x}% 0, ${x - 14}% 100%, 0 100%)` });
    const h = eo(prog(t, 17.05, 17.4)); set($("fh"), { opacity: h, transform: `scale(${lerp(1.3, 1, h)})` }); }

  // G: three ways to get it, each spotlighted for three beats
  { const h = eo(prog(t, 20, 20.35)); set($("gh"), { opacity: h, transform: `scale(${lerp(1.3, 1, h)})` });
    all("#g .plan").forEach((el, i) => { const idx = AR ? 2 - i : i; const k = pop(t, 20.4 + i * 0.25, 0.4); const fa = 21.5 + i * 1.5;
      const focus = clamp(Math.min(prog(t, fa, fa + 0.18), 1 - prog(t, fa + 1.3, fa + 1.5)));
      set(el, { left: `${130 + idx * 570}px`, opacity: k.o * lerp(0.55, 1, Math.max(focus, t < 21.5 || t > 26 ? 1 : 0)), transform: `translateY(${-22 * focus}px) scale(${k.s * (1 + 0.06 * focus + 0.006 * pulse)})`,
        borderColor: `rgba(${lerp(255, 92, focus)},${lerp(255, 200, focus)},255,${lerp(0.14, 1, focus)})`,
        boxShadow: `0 40px 100px -30px rgba(0,0,0,.7), 0 0 ${110 * focus}px rgba(47,107,255,${0.7 * focus})` }); }); }

  // H: end card, CTA beats with the music
  { const p = eo(prog(t, 26, 26.35)); set($("hlogo"), { opacity: clamp(p * 3), transform: `scale(${lerp(2.6, 1, p)})`, filter: `drop-shadow(0 0 ${50 + 50 * pulse}px rgba(92,200,255,.6))` });
    const a = pop(t, 26.5, 0.4); set($("ha"), { opacity: a.o, transform: `scale(${a.s})` });
    const b = eo(prog(t, 27, 27.4)); set($("hb"), { opacity: b * 0.9, transform: `translateY(${lerp(30, 0, b)}px)` });
    const c = pop(t, 27.5, 0.4); const beat = t > 27.9 ? 1 + 0.035 * Math.exp(-6 * ((t - 28) % 1 + (t < 28 ? 1 : 0))) : 1; set($("hc"), { opacity: c.o, transform: `scale(${c.s * beat})` }); }
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => { seek(0); return true; });
</script>
</body>
