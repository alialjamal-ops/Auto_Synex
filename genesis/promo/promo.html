<script>
const AR = new URLSearchParams(location.search).get("lang") === "ar";
const T = AR ? {
  tag: "منصة الحجز الذكية", k1: "كل حجز.", k2: "كل نشاط.", k3: "منصة واحدة.",
  d1: "نشاطك كله أمامك.", d2: "مواعيد اليوم والإيرادات والفريق في لوحة تحكم واحدة.", d3: "تقويم مباشر", d4: "إدارة الفريق والخدمات", d5: "تحليلات فورية",
  p1: "حجز في أقل من دقيقة.", p2: "اختر الخدمة", p3: "اختر الوقت", p4: "تأكيد", p5: "تم الحجز!",
  i0: "مصممة لكل القطاعات", i1: "العيادات", i2: "صالونات التجميل", i3: "أكاديميات التدريب", i4: "استوديوهات التصوير",
  b1: "وضع فاتح وداكن، من اليمين إلى اليسار بإتقان",
  o0: "اختر ما يناسب نشاطك", o00: "ثلاث طرق للحصول على المنصة",
  o1: "اشتراك", o1d: "ابدأ اليوم بخطة شهرية جاهزة.", o1a: "جاهز خلال دقائق", o1b: "التحديثات مشمولة",
  o2: "تخصيص", o2d: "نصممه على هويتك وطريقة عملك.", o2a: "شعارك وألوانك", o2b: "خدماتك وقواعدك",
  o3: "نظام خاص كامل", o3d: "منصة مستقلة تُبنى خصيصاً لك.", o3a: "نطاقك وبياناتك", o3b: "مزايا حسب الطلب", e1: "نحو غدٍ أفضل", e2: "اطلب عرضاً تجريبياً",
} : {
  tag: "SMART AUTOMATION", k1: "Every booking.", k2: "Every business.", k3: "One platform.",
  d1: "Your whole business, live.", d2: "Today's appointments, revenue and team in one dashboard.", d3: "Live calendar", d4: "Team and services", d5: "Instant analytics",
  p1: "Booked in under a minute.", p2: "Choose a service", p3: "Pick a time", p4: "Confirm", p5: "You're booked!",
  i0: "Built for every industry", i1: "Clinics", i2: "Beauty salons", i3: "Training academies", i4: "Photo studios",
  b1: "Light and dark. True right-to-left.",
  o0: "Choose what fits your business", o00: "Three ways to get the platform",
  o1: "Subscription", o1d: "Start today on a ready monthly plan.", o1a: "Live in minutes", o1b: "Updates included",
  o2: "Customization", o2d: "Tailored to your brand and workflow.", o2a: "Your logo and colours", o2b: "Your services and rules",
  o3: "Your own full system", o3d: "A complete private platform, built for you.", o3a: "Your domain and data", o3b: "Features made to order", e1: "Optimizing Tomorrow", e2: "Book a demo",
};
document.documentElement.lang = AR ? "ar" : "en";
document.documentElement.dir = AR ? "rtl" : "ltr";
document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[el.dataset.t]));
document.querySelectorAll("[data-img]").forEach((el) => (el.src = `assets/${el.dataset.img === "dash" ? "dash-light" : "phone"}-${AR ? "ar" : "en"}.jpg`));
if (AR) { document.getElementById("s1sub").style.letterSpacing = "0"; }

// Deterministic star field
const stars = document.getElementById("stars"); let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const starEls = Array.from({ length: 70 }, () => { const e = document.createElement("i"); e.className = "star"; e.dataset.x = rnd() * 1920; e.dataset.y = rnd() * 1080; e.dataset.s = 0.3 + rnd() * 0.9; e.dataset.p = rnd() * 6.28; stars.appendChild(e); return e; });

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 4);           // ease-out quart
const eio = (x) => (x < 0.5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);
const all = (sel) => [...document.querySelectorAll(sel)];
const set = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const DIR = AR ? -1 : 1;

const SCENES = [["s1", 0, 3.5], ["s2", 3.5, 7.3], ["s3", 7.3, 12.4], ["s4", 12.4, 17], ["s5", 17, 21.2], ["s6", 21.2, 24.6], ["s8", 24.6, 30.8], ["s7", 30.8, 35.5]];
window.DURATION = 35.5;

window.seek = (t) => {
  // background
  set($("grid"), { transform: `translate(${-t * 6}px, ${-t * 4}px)` });
  starEls.forEach((e) => set(e, { transform: `translate(${+e.dataset.x - t * 9 * e.dataset.s}px, ${+e.dataset.y}px) scale(${e.dataset.s})`, opacity: 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.6 + +e.dataset.p)) }));
  const flash = Math.max(...SCENES.map(([, a]) => 1 - clamp(Math.abs(t - a) / 0.45)));
  set($("streak"), { opacity: 0.25 + flash * 0.75, transform: `translateY(${lerp(-40, 40, (Math.sin(t * 0.25) + 1) / 2)}px) scaleX(${0.55 + flash * 0.6}) rotate(-4deg)` });

  for (const [id, a, b] of SCENES) {
    const el = $(id); const inn = eo(prog(t, a, a + 0.5)); const out = id === "s7" ? 0 : eio(prog(t, b - 0.4, b));
    const vis = t >= a - 0.01 && t < b + 0.01;
    set(el, { opacity: vis ? inn * (1 - out) : 0, transform: `scale(${lerp(1, 1.06, out)})`, visibility: vis ? "visible" : "hidden" });
  }

  // 1 logo
  { const p = eo(prog(t, 0.15, 1.3));
    set($("s1logo"), { opacity: p, transform: `scale(${lerp(0.72, 1, p)})`, filter: `blur(${lerp(18, 0, p)}px) drop-shadow(0 0 ${lerp(0, 60, p)}px rgba(92,200,255,.45))` });
    const w = eo(prog(t, 0.9, 1.9)); set($("s1word"), { opacity: w, letterSpacing: `${lerp(0.3, 0.02, w)}em`, transform: `translateY(${lerp(30, 0, w)}px)` });
    const s = eo(prog(t, 1.5, 2.3)); set($("s1sub"), { opacity: s * 0.9, transform: `translateY(${lerp(20, 0, s)}px)` }); }

  // 2 kinetic lines
  all("#s2 .l").forEach((el, i) => { const p = eo(prog(t, 3.7 + i * 0.75, 4.5 + i * 0.75)); set(el, { transform: `translateY(${lerp(110, 0, p)}%)`, opacity: p }); });

  // 3 dashboard
  { all("#s3 .a").forEach((el, i) => { const p = eo(prog(t, 7.7 + i * 0.28, 8.5 + i * 0.28)); set(el, { opacity: p, transform: `translateX(${lerp(-50 * DIR, 0, p)}px)` }); });
    all("#s3 .side").forEach((el) => set(el, AR ? { right: "110px", left: "auto" } : { left: "110px", right: "auto" }));
    const p = eo(prog(t, 7.5, 9.2)); const drift = prog(t, 7.5, 12.4);
    set($("s3frame"), { [AR ? "left" : "right"]: "-190px", [AR ? "right" : "left"]: "auto", opacity: p, transform: `perspective(2200px) rotateY(${lerp(-26, -10, p) * DIR}deg) rotateX(${lerp(14, 4, p)}deg) translateY(${lerp(160, 0, p)}px) scale(${lerp(0.94, 1.03, drift)})` }); }

  // 4 phone
  { const p = eo(prog(t, 12.6, 14)); const drift = prog(t, 12.6, 17);
    set($("s4phone"), { [AR ? "right" : "left"]: "190px", [AR ? "left" : "right"]: "auto", opacity: p, transform: `translateY(${lerp(240, -30 * drift, p)}px) rotate(${lerp(-10, -4, p) * DIR}deg)` });
    all("#s4 .side").forEach((el) => set(el, AR ? { right: "760px", left: "auto" } : { left: "760px", right: "auto" }));
    all("#s4 .a").forEach((el) => { const q = eo(prog(t, 12.9, 13.8)); set(el, { opacity: q, transform: `translateY(${lerp(50, 0, q)}px)` }); });
    all("#s4 .st").forEach((el, i) => { const q = back(prog(t, 13.7 + i * 0.5, 14.2 + i * 0.5)); const on = t > 14.1 + i * 0.5; set(el, { opacity: clamp(q), transform: `scale(${lerp(0.7, 1, q)})`, background: on ? "rgba(47,107,255,.28)" : "rgba(255,255,255,.07)", borderColor: on ? "rgba(92,200,255,.7)" : "rgba(255,255,255,.14)" }); });
    const k = back(prog(t, 15.3, 15.9)); set($("s4ok"), { opacity: clamp(k), transform: `scale(${lerp(0.6, 1, k)})`, transformOrigin: AR ? "right center" : "left center" }); }

  // 5 industries
  { const h = eo(prog(t, 17.2, 18)); set($("s5h"), { opacity: h, transform: `translateY(${lerp(40, 0, h)}px)` });
    all("#s5 .card").forEach((el, i) => { const idx = AR ? 3 - i : i; const p = eo(prog(t, 17.5 + i * 0.22, 18.6 + i * 0.22)); const drift = prog(t, 17.5, 21.2);
      set(el, { left: `${130 + idx * 420}px`, top: "300px", opacity: p, transform: `translateY(${lerp(220, (i % 2 ? 26 : -14) - drift * 18, p)}px) rotate(${lerp((i - 1.5) * 5, (i - 1.5) * 1.2, p)}deg)` });
      el.querySelector("img").style.transform = `scale(${lerp(1.18, 1.04, drift)})`; }); }

  // 6 wipe: dark Arabic → light English
  { const p = eo(prog(t, 21.4, 22.4)); set($("s6frame"), { opacity: p, transform: `translateY(${lerp(120, 0, p)}px) scale(${lerp(0.96, 1, p)})` });
    const w = eio(prog(t, 22.3, 23.9)); const x = lerp(115, -15, w);
    set($("s6top"), { clipPath: `polygon(0 0, ${x}% 0, ${x - 14}% 100%, 0 100%)` });
    const h = eo(prog(t, 21.5, 22.3)); set($("s6h"), { opacity: h, transform: `translateY(${lerp(30, 0, h)}px)` }); set($("s6s"), { opacity: h * 0.9 }); }

  // 7 plans: cards rise in order, then a highlight steps through 1 → 2 → 3
  { const h = eo(prog(t, 24.8, 25.6)); set($("s8h"), { opacity: h, transform: `translateY(${lerp(40, 0, h)}px)` }); set($("s8s"), { opacity: h * 0.9 });
    all("#s8 .plan").forEach((el, i) => { const idx = AR ? 2 - i : i; const p = eo(prog(t, 25.3 + i * 0.3, 26.3 + i * 0.3));
      const focus = clamp(1 - Math.abs(t - (27.3 + i * 1.0)) / 0.55);
      set(el, { left: `${130 + idx * 570}px`, opacity: p, transform: `translateY(${lerp(140, -14 * focus, p)}px) scale(${1 + 0.035 * focus})`,
        borderColor: `rgba(${lerp(255, 92, focus)},${lerp(255, 200, focus)},255,${lerp(0.14, 0.9, focus)})`,
        boxShadow: `0 40px 100px -30px rgba(0,0,0,.7), 0 0 ${80 * focus}px rgba(47,107,255,${0.55 * focus})` }); }); }

  // 8 end card
  { const p = eo(prog(t, 31.0, 32.1)); set($("s7logo"), { opacity: p, transform: `scale(${lerp(0.7, 1, p)})`, filter: `drop-shadow(0 0 ${lerp(0, 70, p)}px rgba(92,200,255,.5))` });
    const a = eo(prog(t, 31.5, 32.4)); set($("s7a"), { opacity: a, transform: `translateY(${lerp(40, 0, a)}px)` });
    const b = eo(prog(t, 32.0, 32.8)); set($("s7b"), { opacity: b * 0.9, transform: `translateY(${lerp(30, 0, b)}px)` });
    const c = back(prog(t, 32.5, 33.2)); const pulse = 1 + 0.025 * Math.sin((t - 33.2) * 3.2) * (t > 33.2 ? 1 : 0); set($("s7c"), { opacity: clamp(c), transform: `scale(${lerp(0.7, 1, c) * pulse})` }); }
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => { seek(0); return true; });
</script>
